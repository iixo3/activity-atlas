name: Refresh and deploy Activity Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7,15 * * *"
    # Hourly catch-up check in case GitHub delays or drops a scheduled run.
    - cron: "37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: activity-atlas-pages
  cancel-in-progress: false

jobs:
  check-refresh:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - id: check
        run: node scripts/check-refresh-due.mjs

  build:
    needs: check-refresh
    if: needs.check-refresh.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh public data
        id: refresh
        continue-on-error: true
        env:
          ACTIVITY_ATLAS_SKIP_DUNE: "1"
        run: npm run refresh
      - name: Report observation dates and retained feeds
        if: always()
        continue-on-error: true
        run: node scripts/report-data-health.mjs
      # A failed refresh or check keeps the last good site online until a later run passes.
      # The final step below then marks the run failed and names the stage.
      - name: Lint
        id: lint
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Test
        id: test
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        run: npm test
      - name: Build and test the Pages export
        id: pages
        if: steps.test.outcome == 'success'
        continue-on-error: true
        run: NEXT_PUBLIC_BASE_PATH=/${{ github.event.repository.name }} npm run test:pages
      - name: Persist collected snapshots
        id: persist
        if: steps.pages.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/activity-data.json public/data/activity-series.csv
          git add data/normalized/coinbase-oi-history.json
          git add data/normalized/partial-volume-history.json
          git add data/normalized/composition-cache.json
          git add data/normalized/composition-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh activity snapshot [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outcome == 'success'
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        if: steps.pages.outcome == 'success'
        with:
          path: dist/pages
      - name: Mark the run failed if a stage did not pass
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: node scripts/report-workflow-result.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
